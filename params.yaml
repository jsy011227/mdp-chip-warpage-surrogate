# ============================================================
# 프로젝트 공통 사양 (Single source of truth)
# 모든 코드는 이 파일의 값을 읽어서 쓴다. 코드에 숫자를 직접 쓰지 말 것.
# 단위: 전부 SI (m, W/m·K, W/m², °C)
# 상태: 초안 — A 담당이 11/15(일)까지 팀 확인 후 확정
# ============================================================

version: 0.2

# ---- 입력 벡터 x (순서 고정! 모든 파일·모델이 이 순서를 따른다) ----
inputs:
  - name: w_center      # 휨 제어점: 칩 중앙 높이 (모서리 제어점 = 0 기준)
    unit: m
    range: [0.0, 70.0e-6]
  - name: w_mid_x       # 휨 제어점: 아래·위 변의 가운데 (x 방향 굽힘)
    unit: m
    range: [-20.0e-6, 40.0e-6]
  - name: w_mid_y       # 휨 제어점: 왼쪽·오른쪽 변의 가운데 (y 방향 굽힘)
    unit: m
    range: [-20.0e-6, 40.0e-6]
  - name: tilt_x        # 조립 기울기: x 방향 양 끝 높이 차 (가정값)
    unit: m
    range: [-10.0e-6, 10.0e-6]
  - name: tilt_y        # 조립 기울기: y 방향 양 끝 높이 차 (가정값)
    unit: m
    range: [-10.0e-6, 10.0e-6]
  - name: k_tim         # TIM 열전도율 (폴리머 TIM)
    unit: W/m-K
    range: [1.5, 6.0]
  - name: hs_x          # 핫스팟 중심 x
    unit: m
    range: [2.0e-3, 23.6e-3]
  - name: hs_y          # 핫스팟 중심 y
    unit: m
    range: [2.0e-3, 23.6e-3]
  - name: hs_q          # 핫스팟 추가 열유속 (평균 위에 더해지는 최댓값)
    unit: W/m2
    range: [80.0e+4, 240.0e+4]   # 합계 최대 = 평균의 2~4배 (가정)

# ---- DOE 단계에서 거를 제약 ----
constraints:
  max_warp_peak_to_valley: 45.0e-6   # 기울기 제외 휨 곡면의 최고-최저 차 [m]

# ---- 고정값 ----
fixed:
  die_size: 25.6e-3        # 정사각형 다이 한 변 [m]
  die_thickness: 0.78e-3   # [m]
  k_si: 130.0              # 실리콘 열전도율 [W/m-K] (온도 의존성 무시)
  h_coldplate: 7.0e+4       # 냉각판 열전달계수 [W/m2-K] (보정 추정값)
  t_coolant: 25.0          # 냉각수 온도 [°C]
  q_avg: 80.0e+4            # 평균 발열 [W/m2] = 80 W/cm2
  tim_min: 40.0e-6         # 가장 얇은 곳의 TIM 두께 [m]
  hs_sigma: 2.0e-3         # 핫스팟 크기(가우시안 σ) [m], 2.5D 성립 조건: ≥ 1 mm

# ---- 해석 설정 ----
solver:
  grid: 64                 # 칩 한 변의 격자 수 (격자 수렴 확인: 256 대비 평균 0.04 K)
  si_layers: 2             # 실리콘 두께 방향 층 수 (Bi_z 0.09~0.29 → 1층 불가, 2층: 12층 대비 최대 0.2~0.4 K)

# ---- 판정 ----
failure:
  tj_max_limit: 105.0      # [°C] 이 값을 넘으면 불량 (가정)

# ---- 재현성 ----
seeds:
  doe: 2026
  split: 7
  monte_carlo: 11
